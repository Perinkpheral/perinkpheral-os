openapi: 3.1.0
info:
  title: perINKpheral device API
  version: 0.1.40
  license:
    name: MIT
    identifier: MIT
  description: |
    The HTTP API of a perINKpheral device, served by the device itself on port 80.
    The device's web page uses it; so do the command line tools.

    This full API runs in application mode. Recovery serves only GET /,
    GET /api/status and POST /api/ota. It does not serve settings, logs,
    applications or development routes.

    Main requires Host to name the station address, 192.168.4.1, the configured
    hostname or its .local form, compared case-insensitively without the port.
    Main strips a Host port without validating it. When Origin is present, the
    text after :// must exactly equal Host. Recovery accepts the same names but
    permits only an omitted port or :80; a present Origin must exactly equal
    http:// followed by Host. Main's root page is exempt from these checks.

    Main's ordinary API handlers return JSON error and confirmation objects,
    {"error":"..."} and {"ok":"..."}. Development handlers generally return
    text/plain confirmations and errors; /api/dev/flash uses the ordinary JSON
    firmware refusal. Protected main operations can return 403 with the non-JSON
    body `Forbidden.` before the handler runs. Framework error helpers return
    text/html, including some allocation and serialization failures.
    Memory-admission and asynchronous-worker refusals return 503 JSON errors on
    routes that use those checks. Storage failures are documented per operation.

    Firmware updates, factory reset and a change of the Wi-Fi network wait for
    a press of OK on the device, up to a minute; installing a system application
    also requires this confirmation. The press must begin after the question
    reaches the panel. Unanswered main-firmware questions return
    `403 {"error": "Not confirmed."}`. Recovery's upload instead returns 400
    with a text message, including cancellation and timeout; its successful response
    is `{"message": "Installed. Restarting."}`. Clients must then wait for the
    expected image_id and on_probation=false in application mode.

    `/api/dev/*` exists only in firmware built with the development tools.
    There is no authentication. Origin and Host checks restrict browser requests;
    they do not authenticate command line clients. Update all and Refresh are
    page operations over the existing install and catalog routes, not endpoints.
servers:
  - url: http://{device}
    variables:
      device:
        default: perinkpheral-xxxx.local
        description: The device's name or address

tags:
  - name: Device
  - name: Settings
  - name: Apps
  - name: Catalogs
  - name: Glyphs
  - name: Firmware
  - name: Development

components:
  schemas:
    Ok:
      type: object
      properties:
        ok: { type: string, examples: ["Saved."] }
      required: [ok]
    Error:
      type: object
      properties:
        error: { type: string, examples: ["Invalid request."] }
      required: [error]
    Status:
      type: object
      description: |
        Recovery returns mode, ota_protocol, firmware, on_probation, uptime_s,
        boot_id, partition_table and upload_state only. Its on_probation is always
        false; this does not mean a new main image has been confirmed.
      properties:
        name: { type: string, description: Device name }
        firmware: { type: string, examples: ["0.1.40", "recovery-1"] }
        supported_abis:
          type: array
          description: Explicit supported application ABI generations; membership, never a version ceiling.
          items: { type: integer, minimum: 1 }
          examples: [[3]]
        mode: { type: string, enum: [application, recovery] }
        ota_protocol: { type: integer, enum: [1] }
        partition_table: { type: integer, description: Image layout identifier }
        image_id: { type: string, description: Main image ELF SHA-256 in lowercase hexadecimal }
        boot_id: { type: integer, description: Recovery boot identity; changes after a restart }
        upload_state: { type: string, enum: [idle, receiving, confirming, writing, failed, restarting], description: Recovery only }
        slot: { type: string, examples: ["ota_0"] }
        on_probation: { type: boolean, description: A new image not confirmed yet }
        wifi: { type: string, enum: [online, connecting, setup, rescue, off], description: "off: Wi-Fi turned off by forgetting the network; this API is not reachable then" }
        ssid: { type: string }
        address: { type: string }
        rssi: { type: integer, description: "The signal of the access point the device is on, in dBm; absent when it is on none" }
        tz: { type: string, description: POSIX TZ string }
        time: { type: string, description: "Local time, when known" }
        hostname: { type: string }
        idf: { type: string }
        built: { type: string }
        uptime_s: { type: integer }
        free_memory: { type: integer, description: Bytes }
        least_free_memory: { type: integer, description: "Bytes, since start" }
        reset_reason: { type: integer, description: "esp_reset_reason(): 3 restart, 4 fault, 5 interrupt watchdog" }
        last_panic: { type: string, description: "Record of the last fault, if any" }
        app_area_used: { type: integer, description: "Peak bytes used since the last application unload; 0 when unavailable" }
        app_area: { type: integer, description: "Configured application area size in bytes; see app_area_available for reservation state" }
        app_area_available: { type: boolean, description: "Whether the configured application area was reserved at boot; false means applications cannot start" }
        storage_ok: { type: boolean }
        storage_used: { type: integer, description: Bytes }
        storage_total: { type: integer, description: Bytes }
        largest_free_block: { type: integer, description: Bytes }
        usb_host: { type: boolean, description: A computer is on the USB cable }
        dev_tools: { type: boolean, description: The firmware has the development tools (/api/dev); absent otherwise }
        memory_refusals: { type: integer }
        failed_allocations: { type: integer }
    Settings:
      type: object
      description: >-
        Every field is optional on POST; what is sent is checked as a whole and stored. The keys
        are the settings' own. Unknown fields are ignored. Wi-Fi changes use /api/wifi.
        If device_name, ntp_server or language differs from its previous value, the
        response is "Saved. Restart to apply." Otherwise it is "Saved." The request
        does not restart the device. Other accepted changes take effect immediately.
        The system application API has a smaller explicit allowlist: it cannot access
        refresh_min_button_ms. See sdk/host/sys.h.
      properties:
        device_name: { type: string, description: "1..32 UTF-8 bytes; control characters are refused" }
        hostname: { type: string, readOnly: true }
        wifi_ssid: { type: string, readOnly: true }
        wifi_off: { type: boolean, readOnly: true, description: "No network on purpose: no setup access point. Follows /api/wifi" }
        ntp_server: { type: string, description: "1..64 bytes; ASCII letters, digits, dots, colons and hyphens only" }
        tz: { type: string, description: "1..47 printable ASCII bytes without spaces; checked lexically, not parsed as a POSIX TZ expression before storage" }
        tz_city: { type: string, description: "0..31 printable ASCII bytes; city label in English; empty means no selected city" }
        refresh_min_data_s: { type: integer, minimum: 10, maximum: 3600, default: 60, description: Seconds between refreshes driven by data }
        refresh_full_every:
          type: integer
          anyOf: [{ minimum: 0, maximum: 50 }, { const: 255 }]
          default: 255
          description: "Full refresh after so many partial ones; 0 always full, 255 no periodic full refresh"
        refresh_keepalive_h: { type: integer, minimum: 1, maximum: 168, default: 24, description: Hours before a refresh is forced }
        dither: { type: boolean }
        font: { type: integer, description: "Only 0 (Departure Mono) and 1 (Jersey) are accepted" }
        refresh_fast: { type: boolean }
        header_clock: { type: boolean, description: Time instead of the date in the header }
        app_auto_update: { type: boolean, default: false, description: Check installed applications for updates daily without an open browser }
        log_enabled: { type: boolean, description: Enable ordinary logs; retains the chosen level while disabled }
        log_level: { type: integer, enum: [1, 2, 3], description: "1 errors, 2 warnings, 3 information; applied immediately" }
        time_auto: { type: boolean, description: Time from the network }
        power_saving: { type: integer, enum: [0, 1, 2], description: "0 off, 1 always, 2 auto" }
        default_app: { type: string, description: "0..13 bytes; lowercase ASCII letters, digits, underscores and hyphens only; empty means none" }
        language: { type: string, description: "Only en and ru are accepted", examples: ["en", "ru"] }
        languages:
          type: array
          readOnly: true
          items:
            type: object
            properties:
              code: { type: string }
              name: { type: string }
        menu_idle_min: { type: integer, minimum: 1, maximum: 60 }
        refresh_min_button_ms: { type: integer, minimum: 0, maximum: 10000, description: Least pause before answering a press }
        menu_order:
          type: array
          readOnly: true
          items: { type: string }
          description: >-
            The order the user set in the device's menu, by application name ("sys.settings" for a
            system one); an application not named comes first. Set on the device only.
    App:
      type: object
      properties:
        name: { type: string }
        title: { type: string }
        version: { type: string }
        description: { type: string, description: "Translated description, when provided" }
        icon: { type: array, items: { type: string }, description: 11 rows of 11 characters }
        hosts: { type: array, items: { type: string } }
        polls:
          type: array
          items: { type: object }
          description: >-
            Up to four manifest poll objects. Each requires url (URL template, at
            most 511 bytes) and every (10..86400 seconds, or a declared setting
            reference of the form {{key}}). Optional headers maps up to four names
            of at most 31 bytes to value templates of at most 255 bytes. Optional
            pick contains up to 16 JSON extraction paths of at most 63 bytes each.
            each names a declared list setting. prefix requires each and contains
            1..15 printable ASCII bytes without spaces. method is GET by default,
            or POST, PUT, DELETE, PATCH, HEAD, PROPFIND or REPORT. Optional body is
            a text template of at most 1024 bytes before and after expansion;
            its presence is forbidden with GET and HEAD, even when empty.
        intents: { type: array, items: { type: string } }
        system: { type: boolean }
        writes_files: { type: boolean }
        fullscreen: { type: boolean }
        companion: { type: string }
        trusts: { type: array, items: { type: string }, description: Certificate authorities of its own }
        settings:
          type: array
          items: { $ref: "#/components/schemas/AppSetting" }
          description: As the manifest declares them, translated; hidden declarations are included
        values:
          type: object
          additionalProperties: { oneOf: [{ type: string }, { type: boolean }] }
          description: >-
            Stored values. A setting other than a secret or link with nothing stored is
            left out, so that its manifest default applies; a stored empty value is an empty
            string and overrides the default. A secret or custom link is returned only as set (true) or
            not (false). An absent link with a public manifest default returns that
            default as text; a stored empty link returns false and overrides the default.
            Oversized secrets and links are set (true). Unavailable ordinary values are
            omitted and their setting declaration has unavailable: true; the page does not save them.
            Hidden is a form rule, not a restriction on API reads or writes.
    AppSetting:
      type: object
      properties:
        unavailable: { type: boolean, readOnly: true, description: Stored value cannot be read; exclude this field from saving }
        key: { type: string }
        title: { type: string }
        type: { type: string, enum: [text, secret, number, choice, toggle, place, url, link, list] }
        hidden: { type: boolean, default: false, description: Omitted from the page form; writable through /api/apps/settings }
        help: { type: string }
        default:
          description: >-
            List settings use a nonempty array of string items; other supported
            defaults are nonempty text. Secret and place settings have no default.
            A list default must fit the 255-byte stored value, including LF separators;
            each item contains 1..63 printable ASCII bytes.
        options: { type: array, items: { type: string } }
        labels: { type: array, items: { type: string }, description: "Translated choice labels, when available" }
        latitude: { type: string, description: Key of the latitude setting for a place }
        longitude: { type: string, description: Key of the longitude setting for a place }
    CatalogFile:
      type: object
      properties:
        name: { type: string }
        size: { type: integer }
        sha256: { type: string }
      required: [name, size, sha256]
  parameters:
    App:
      name: app
      in: query
      required: true
      schema: { type: string }
      description: Name of an installed application
  responses:
    Ok:
      description: Done
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Ok" }
    Error:
      description: Refused, with the reason
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Text:
      description: Plain text answer
      content:
        text/plain:
          schema: { type: string }

paths:
  /:
    get:
      tags: [Device]
      summary: The device's web page
      description: |
        302 redirects captive portal requests to http://192.168.4.1/ with
        Cache-Control: no-store and an empty body. Main redirects only while its
        setup access point is active. Recovery can return 400 text/html with
        body Forbidden. and Connection: close for invalid Host or Origin.
      responses:
        "200":
          description: >-
            In application mode, gzip-compressed HTML with an ETag naming the firmware image
            and Cache-Control no-cache. In recovery, plain HTML with Cache-Control no-store,
            no ETag and no conditional response.
          content:
            text/html: {}
        "304":
          description: Application mode only - the browser's copy, named in If-None-Match, is this firmware's page

  /api/status:
    get:
      tags: [Device]
      summary: Read device status
      description: |
        Recovery returns 400 text/html with body Forbidden. and Connection: close
        for invalid Host or Origin.
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }

  /api/screen:
    get:
      tags: [Device]
      summary: The frame on the panel; the page saves it as a screenshot
      description: |
        503 JSON error: Not enough memory. (less than 40 KB free or no 16 KB block);
        503 text/plain body: `no memory` or `the host did not answer`
      responses:
        "200":
          description: 1-bit BMP, 400 x 300
          headers:
            X-Frame: { schema: { type: integer }, description: How many frames the panel has shown since start }
            X-Pending: { schema: { type: string, enum: ["0", "1"] }, description: "1: a newer frame is on its way to the panel" }
          content:
            image/bmp: {}

  /api/log:
    get:
      tags: [Device]
      summary: The last 4 KB of the log
      parameters:
        - name: since
          in: query
          schema: { type: integer }
          description: The X-Log-End of the previous answer; only what came after it
      responses:
        "200":
          description: Log text
          headers:
            X-Log-End:
              schema: { type: integer }
              description: Where this answer ends, for the next `since`
            X-Log-Boot:
              schema: { type: integer }
              description: The run of the device the log is of; another after every restart
          content:
            text/plain:
              schema: { type: string }

  /api/restart:
    post:
      tags: [Device]
      summary: Restart
      description: |
        200 application/json: {"ok":"Restarting."}.
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /api/reset:
    post:
      tags: [Device]
      summary: Factory reset, confirmed on the device
      description: |
        200 application/json: {"ok":"Reset. Restarting."}.
        403 JSON error: Not confirmed.
        503 JSON error: Device busy. or Not enough memory.
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /api/settings:
    get:
      tags: [Settings]
      summary: The device's settings
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
    post:
      tags: [Settings]
      summary: Change settings
      description: |
        The body must contain 1..511 bytes.
        200 JSON ok: Saved. or Saved. Restart to apply.
        400 JSON error: Invalid request., Invalid value., or a configuration-validation
        message. These include Device name is empty., Device name has control
        characters., NTP server is empty., NTP server has invalid characters.,
        Time zone must be a POSIX TZ string (max 47)., Invalid city., Unknown language.,
        and Invalid default app. Type, range and text-length failures detected
        while reading fields return Invalid value.
        500 JSON error: Storage error.
        503 JSON error: Device busy.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Settings" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/Error" }

  /api/wifi/scan:
    post:
      tags: [Settings]
      summary: Scan nearby Wi-Fi networks without changing the saved connection
      description: |
        503 JSON error: Wi-Fi is busy. Try again shortly., Could not scan networks.
        Try again., Device busy., or Not enough memory.
      responses:
        "200":
          description: Up to 16 distinct visible network names, strongest signal first
          content:
            application/json:
              schema:
                type: object
                properties:
                  networks:
                    type: array
                    maxItems: 16
                    items:
                      type: object
                      properties:
                        ssid: { type: string }
                        rssi: { type: integer, description: Signal strength in dBm }
                        secured: { type: boolean }
        "503": { $ref: "#/components/responses/Error" }

  /api/wifi:
    post:
      tags: [Settings]
      summary: Join another Wi-Fi network, confirmed on the device; the device restarts
      description: >-
        An empty ssid on a device with a network forgets it and turns Wi-Fi off: the device
        restarts with no access point. Connect to Wi-Fi in Settings on the device brings the
        setup access point back.
        The body must contain 1..511 bytes.
        200 JSON ok: Saved. Restarting.
        400 JSON error: Invalid request., Invalid value., or a configuration-validation
        message. These include Wi-Fi SSID has control characters., Wi-Fi password
        must be printable ASCII., Wi-Fi password without an SSID., Wi-Fi password
        must be at least 8 characters., Time zone must be a POSIX TZ string (max 47).,
        and Invalid city. Wrong field types and oversized fields return Invalid value.
        403 JSON error: Not confirmed.
        500 JSON error: Storage error.
        503 JSON error: Device busy. or Not enough memory.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ssid: { type: string }
                password: { type: string }
                tz: { type: string, description: "Time zone to set alongside Wi-Fi, replacing any existing zone" }
                tz_city: { type: string, description: "The city the zone was chosen by, by its English name" }
              required: [ssid]
              description: >-
                ssid is required. Omitted password, tz and tz_city retain their
                previous values. To forget a password-protected network, send both
                "ssid": "" and "password": "". SSID is at most 32 bytes and must
                contain no control characters. Password is printable ASCII, at most
                64 bytes; a nonempty password requires a nonempty SSID and at least
                8 characters. Time-zone fields use the Settings constraints.
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /api/time:
    post:
      tags: [Settings]
      summary: Set the time zone
      description: |
        The body must contain 1..511 bytes. Omitting tz_city clears the selected
        city. tz and tz_city use the Settings constraints.
        200 JSON ok: Saved.
        400 JSON error: Invalid request., Invalid value., Time zone must be a POSIX
        TZ string (max 47)., or Invalid city.
        500 JSON error: Storage error.
        503 JSON error: Device busy.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tz: { type: string, description: POSIX TZ string, examples: ["MSK-3"] }
                tz_city: { type: string, description: "The city the zone was chosen by, by its English name; empty for a zone of its own" }
              required: [tz]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/Error" }

  /api/clock:
    post:
      tags: [Settings]
      summary: Set the clock by hand; refused while time comes from the network
      description: |
        The body must contain 1..511 bytes.
        200 JSON ok: Saved.
        400 JSON error: Invalid request., Invalid value., or Time is set automatically.
        503 JSON error: Device busy.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                unix: { type: integer, description: "Unix seconds, from 2026 to before 2100; refused while the network's time is on" }
              required: [unix]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/Error" }

  /api/apps:
    get:
      tags: [Apps]
      summary: Installed applications with their settings
      description: |
        503 JSON error: Applications unavailable. or Not enough memory.
        A failure after streaming starts closes the connection without completing
        the JSON response.
      responses:
        "200":
          description: Applications
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/App" }

  /api/apps/settings:
    post:
      tags: [Apps]
      summary: Store application settings
      description: |
        The body must contain 1..4608 bytes. After any successful write or secret
        deletion, the application is notified and its polls are requested again.
        200 JSON ok: Saved.
        400 JSON error: Invalid request. or Invalid value: <key>.
        404 JSON error: App not found.
        507 JSON error: Not enough storage.
        500 JSON error: Storage error.
        503 JSON error: Device busy.
      parameters:
        - $ref: "#/components/parameters/App"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: { type: string }
              description: >-
                Declared setting key to text value, including hidden settings. Missing
                keys are unchanged; an empty non-secret value is stored and overrides a
                default, while an empty secret deletes its key. Validation precedes
                writes, but writes are not transactional. Changing a url/link destination
                whose previous stored or default value is nonempty first deletes all
                declared secrets, including supplied replacements. Destinations are then
                written before other supplied values, including replacement secrets.
                A failed save can leave a supplied secret deleted.
                Each key must be declared in the installed manifest. Each value is
                at most 255 bytes. Empty text is accepted for every setting type.
                Other values must match the declared type: toggle is "0" or "1";
                choice is a declared option; number is decimal text without an
                exponent; url is an http/https server address without a path,
                query, fragment or user information; link is a complete http/https
                address without spaces or user information. Values are printable
                ASCII except list separators. A nonempty list contains LF-separated,
                nonempty printable ASCII items of at most 63 bytes, with no trailing LF.
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "507":
          description: >-
            Not enough storage. Earlier writes or secret deletions may have
            succeeded. The application is notified and its polls requested again
            only if at least one write succeeded. Later write phases may be skipped.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/apps/install:
    post:
      tags: [Apps]
      summary: Install or update an application from a catalog
      description: |
        The body must contain 1..2048 bytes. A newly installed application opens
        after commit; updating an installed application does not automatically open it.
        On arrival, admission requires a page's worth of memory (24 KB free and
        an 8 KB contiguous block). The download waits behind an active poll;
        session admission (60 KB free and a 17 KB contiguous block) occurs when
        the download starts. The request holds the sole waiting-handler slot
        meanwhile; another waiting request receives 503 with "Device busy."
        200 JSON ok: Installed.
        400 JSON error: Invalid request.
        403 JSON error: Not confirmed.
        409 JSON error: Not enough storage., Update Perinkpheral OS., or Update the app.
        500 JSON error: Storage error.
        503 JSON error: Device busy. or Not enough memory.
        502 JSON error: Invalid catalog entry., Download failed., Checksum mismatch.,
        Invalid manifest., Invalid app author., Source changed., or App or source changed.
      parameters:
        - name: source
          in: query
          required: true
          schema: { type: integer }
          description: Zero-based index in GET /api/sources; 0 is the fixed official source. An unavailable index is refused.
        - name: app
          in: query
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                version: { type: string, description: Expected catalog version; a changed downloaded version is refused }
                approved_authorities:
                  type: integer
                  minimum: 0
                  maximum: 2
                  default: 0
                  description: Number of package certificate authorities approved by the user; must match the downloaded manifest. Every certificate must be among the hashed files.
                files:
                  type: array
                  minItems: 2
                  maxItems: 8
                  description: >-
                    As listed in the catalog index, with app.wasm first and
                    manifest.json last. File names must be unique. Each file must
                    be nonempty; its declared size and SHA-256 must match the
                    download. app.wasm is limited to 49152 bytes, manifest.json to
                    8192 bytes. Intermediate files together may use at most 65536
                    bytes when each is rounded to 4096-byte blocks. Additional
                    writer-quota and free-storage checks apply.
                  items: { $ref: "#/components/schemas/CatalogFile" }
              required: [files]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409":
          description: >-
            Not enough storage, or the application needs a newer firmware ("Update Perinkpheral OS.",
            "firmware" of its manifest) or an unsupported ABI ("Update the app.").
            The downloaded manifest governs compatibility; the index is not authoritative.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502": { $ref: "#/components/responses/Error" }

  /api/apps/remove:
    post:
      tags: [Apps]
      summary: Remove an application; what it stored stays unless forget=1
      description: |
        200 JSON ok: Removed.
        404 JSON error: App not found.
        500 JSON error: Storage error.
        503 JSON error: Device busy.
      parameters:
        - $ref: "#/components/parameters/App"
        - name: forget
          in: query
          schema: { type: integer, enum: [1] }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "404": { $ref: "#/components/responses/Error" }

  /api/apps/removed:
    get:
      tags: [Apps]
      summary: List removed applications with retained store values
      description: |
        Returns up to 16 removed application names with retained blob store values.
        This is not a removal history. Stores can be reclaimed when the application-store
        partition needs space.
      responses:
        "200":
          description: Names
          content:
            application/json:
              schema:
                type: array
                items: { type: string }

  /api/sources:
    get:
      tags: [Catalogs]
      summary: Catalog sources, the official one first
      description: |
        Includes the fixed official source first. Trailing slashes are removed
        from returned source URLs.
      responses:
        "200":
          description: Sources
          content:
            application/json:
              schema:
                type: object
                properties:
                  sources: { type: array, items: { type: string, format: uri } }
    post:
      tags: [Catalogs]
      summary: Set the added sources, up to three, https only
      description: |
        The body must contain 1..2048 bytes. Each added source is an https:// URL
        of at most 127 printable ASCII bytes without spaces. The exact fixed
        official-source URL is ignored if submitted.
        200 JSON ok: Saved.
        400 JSON error: Too many sources. or Invalid source URL.
        500 JSON error: Storage error.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sources: { type: array, maxItems: 3, items: { type: string, format: uri } }
              required: [sources]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/Error" }

  /api/catalog:
    get:
      tags: [Catalogs]
      summary: Stream a catalog index
      description: |
        source is a zero-based index in GET /api/sources; 0 is the fixed official
        source. An unavailable index is refused.
        On arrival, admission requires a page's worth of memory (24 KB free and
        an 8 KB contiguous block). The download waits behind an active poll;
        session admission (60 KB free and a 17 KB contiguous block) occurs when
        the download starts. The request holds the sole waiting-handler slot
        meanwhile; another waiting request receives 503 with "Device busy."
        404 JSON error: Source not found.
        502 JSON error: Source unavailable (HTTP <status>).
        503 JSON error: Not enough memory. or Device busy.
        After body streaming starts, a failed fetch closes the connection without
        its final chunk.
      parameters:
        - name: source
          in: query
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: catalog.json of the source
          content:
            application/json: {}
        "404": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /api/glyphs:
    get:
      tags: [Glyphs]
      summary: Installed glyph packs
      responses:
        "200":
          description: Packs
          content:
            application/json:
              schema:
                type: object
                properties:
                  packs:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        bytes: { type: integer }
                  free: { type: integer, description: Bytes left }
    post:
      tags: [Glyphs]
      summary: Install a glyph pack
      description: |
        Upload the complete binary glyph pack, 1..32768 bytes. A pack replaces one
        with the same embedded name. Invalid data, unavailable glyph storage,
        insufficient space and write failures return 400 JSON error Invalid pack.
        If space requires deleting the previous pack first, a failed replacement
        can leave it removed.
        200 JSON ok: Installed.
        503 JSON error: Device busy. or Not enough memory.
        Allocation failure can return a framework 500 text/html response. An
        interrupted body can close the connection without an API error object.
      requestBody:
        required: true
        content:
          application/octet-stream: {}
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/Error" }

  /api/glyphs/remove:
    post:
      tags: [Glyphs]
      summary: Remove a glyph pack
      description: |
        200 JSON ok: Removed.
        404 JSON error: Not installed.
        503 JSON error: Device busy.
      parameters:
        - name: name
          in: query
          required: true
          schema: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "404": { $ref: "#/components/responses/Error" }

  /api/ota/recovery:
    post:
      tags: [Firmware]
      summary: Select recovery and restart; uploading there requires physical OK
      description: |
        Main only. Refused while main is on probation. Selects factory by clearing
        OTA metadata, but does not erase main or user data and needs no physical OK.
        Wait for status.mode=recovery before uploading. This does not update the
        recovery image itself; replacing recovery requires USB.
        200 JSON ok: Entering recovery.
        400 JSON error: Previous update is being verified. or Recovery image unavailable.
        Restore it over USB.
        503 JSON error: Device busy. or Not enough memory.
      parameters:
        - name: manual
          in: query
          description: |
            With manual=true, enter recovery without an expected upload. Omitted or
            false records a one-use planned-update hint. Screen behavior depends on
            the installed recovery version; older recovery images ignore the hint.
          schema: { type: boolean, default: false }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /api/ota:
    post:
      tags: [Firmware]
      summary: Upload firmware in recovery; main returns 409 until recovery is entered
      description: |
        Recovery checks the image header, project, chip and partition layout before
        asking for physical OK. After confirmation it writes only ota_0, verifies
        the complete image and restarts main on probation. Installed apps and their
        data are preserved. A failed write may leave main incomplete; recovery stays
        available for another upload. A lost HTTP response is not proof of failure
        or success: check mode, boot_id, upload_state and the intended image_id.
        Send a known Content-Length containing the complete image, at least 304 bytes
        and no larger than the ota_0 partition. Recovery allows 15 seconds to receive
        the initial header and 180 seconds to receive the remaining image after
        confirmation. Error responses close the connection.
        Main returns 409 application/json with
        {"error":"Enter recovery before uploading firmware."} and Connection: close.
        Shared asynchronous-worker refusals in main can return 503 JSON errors
        Device busy. or Not enough memory.
      requestBody:
        required: true
        content:
          application/octet-stream: {}
      responses:
        "200":
          description: Image installed; restarting into main, which must still complete probation
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { type: string, const: "Installed. Restarting." }
        "409": { $ref: "#/components/responses/Error" }
        "400":
          description: >-
            Recovery returns 400 text/html and closes the connection. Messages are
            Forbidden., Device busy., Invalid image size., Upload interrupted.,
            Invalid image., Image is for another partition table. Flash over USB.,
            Image is incompatible with this chip revision., Not confirmed.,
            Write failed., or Image verification failed.
          content:
            text/html:
              schema: { type: string, examples: ["Not confirmed.", "Upload interrupted.", "Forbidden."] }
        "403": { $ref: "#/components/responses/Error" }

  /api/ota/release:
    post:
      tags: [Firmware]
      summary: Obsolete device-side downloader; returns 409, download through the browser instead
      deprecated: true
      description: |
        Main only. The request body is ignored; no download is started.
        409 JSON error: Download perinkpheral.bin from the latest GitHub release,
        then click Device > Enter recovery and install the file.
        503 JSON error: Device busy. or Not enough memory.
      responses:
        "409": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /api/dev/button:
    post:
      tags: [Development]
      summary: Press a button
      description: |
        200 text/plain body: pressed
        400 text/plain body: button=1..4 is missing or
        button is 1..4, press is short, long, down or up
      parameters:
        - name: button
          in: query
          required: true
          schema: { type: integer, minimum: 1, maximum: 4 }
          description: 1 up, 2 OK, 3 down, 4 back
        - name: press
          in: query
          schema: { type: string, enum: [short, long, down, up], default: short }
      responses:
        "200": { $ref: "#/components/responses/Text" }
        "400": { $ref: "#/components/responses/Text" }

  /api/dev/open:
    post:
      tags: [Development]
      summary: Put an installed application on the screen
      description: |
        200 text/plain body: opened
        400 text/plain body: app=<name> is missing
        404 text/plain body: no such application is installed
        503 text/plain body: Device busy.
      parameters:
        - name: app
          in: query
          required: true
          schema: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Text" }
        "404": { $ref: "#/components/responses/Text" }

  /api/dev/app:
    post:
      tags: [Development]
      summary: Upload one file of an application
      description: |
        name must be an application name of at most 13 bytes; file must be a permitted
        package file name of at most 23 bytes. Reserved file names are refused. The
        body must be nonempty. app.wasm is limited to 49152 bytes, manifest.json to
        8192 bytes, and other files to 65536 bytes. This stages and commits one file;
        it does not validate the complete package or reload the installed application
        list. Use /api/dev/run to restart into the uploaded application.
        200 text/plain body: stored
        400 text/plain body: name=<application>&file=<its file>, not a file's name,
        the file is empty or too large for an application, or
        not an application's name, or the storage refused
        503 text/plain body: the device is busy
        500 text/plain body: the file could not be stored
      parameters:
        - name: name
          in: query
          required: true
          schema: { type: string }
          description: Application name
        - name: file
          in: query
          required: true
          schema: { type: string }
          description: File name, such as app.wasm or manifest.json
      requestBody:
        required: true
        content:
          application/octet-stream: {}
      responses:
        "200": { $ref: "#/components/responses/Text" }
        "500": { $ref: "#/components/responses/Text" }

  /api/dev/run:
    post:
      tags: [Development]
      summary: Restart into an application
      description: |
        The application name is checked for permitted characters and a length of
        1..13 bytes, but is not checked against installed applications before restart.
        A successful response confirms that the restart was requested, not that the
        application exists or can start.
        200 text/plain body: restarting
        400 text/plain body: app=<name> is missing or is not an application's name
        503 text/plain body: the device is busy
      parameters:
        - name: app
          in: query
          required: true
          schema: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Text" }

  /api/dev/kv:
    post:
      tags: [Development]
      summary: Write a value into an application's store
      description: |
        The body contains 0..1024 raw bytes; an empty body deletes the key. app must
        use permitted application-name characters and contain 1..13 bytes. key must
        contain 1..15 bytes. The application need not be installed. This development
        route writes the store directly, bypassing manifest setting validation,
        application-side url/link restrictions and destination-change secret clearing.
        A successful write notifies the application, if installed, and requests its
        polls again.
        200 text/plain body: stored
        400 text/plain body: app=<name>&key=<key>, the value as the body;
        the value is too long; or the value did not arrive
        500 text/plain body: not stored
        503 text/plain body: Device busy.
      parameters:
        - name: app
          in: query
          required: true
          schema: { type: string }
        - name: key
          in: query
          required: true
          schema: { type: string }
      requestBody:
        description: The value as it is; empty removes the key
        content:
          application/octet-stream: {}
      responses:
        "200": { $ref: "#/components/responses/Text" }
        "400": { $ref: "#/components/responses/Text" }
        "500": { $ref: "#/components/responses/Text" }

  /api/dev/flash:
    post:
      tags: [Development]
      summary: Obsolete direct upload; enter recovery and upload through /api/ota instead
      deprecated: true
      description: >-
        After Host and Origin checks, returns 409 with the JSON error
        Enter recovery before uploading firmware. Development builds do not bypass
        physical confirmation. The response closes the connection.
      responses:
        "409": { $ref: "#/components/responses/Error" }

  /api/dev/restart:
    post:
      tags: [Development]
      summary: Restart
      description: |
        200 text/plain body: restarting
      responses:
        "200": { $ref: "#/components/responses/Text" }

  /api/dev/sockets:
    get:
      tags: [Development]
      summary: List socket types, local ports and remote endpoints
      responses:
        "200": { $ref: "#/components/responses/Text" }

  /api/dev/crash:
    post:
      tags: [Development]
      summary: A deliberate fault, to test the fault record
      parameters:
        - name: kind
          in: query
          required: true
          schema: { type: string, enum: [wdt, abort] }
      responses:
        "400":
          description: >-
            Unknown kind. The actual response is text/html with body `kind=wdt|abort`.
            Recognized kinds terminate the device without an HTTP response.
          content:
            text/plain: {}
