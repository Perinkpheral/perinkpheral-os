#
# The applications a device flashed from scratch has installed: ordinary
# catalog applications, which the user can remove and which update from the
# catalog like any other. Only a first flash writes them (the image of the
# "apps" partition); a firmware update and a flash that keeps data do not.
#
# The packages are those the repository has committed in catalog/ at the
# commit: a build is the same however the catalog moves on. To take the
# catalog's main: tools/perinkpheral preinstalled bump firmware/preinstalled.properties
# CI reads the repository and the commit from here: this is the one place.
repository = Perinkpheral/perinkpheral-apps
