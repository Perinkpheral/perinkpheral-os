<!doctype html>
<!--

  Copyright (c) 2026 GrakovNe

  A companion page: what an application's manifest names as "companion".
  The device's own page opens it in a window when the user presses
  "Set up" in the application's settings. It does what a form with four
  fields cannot - signs the user in, lets them choose a calendar - and
  hands the result back as settings. It is a static page on any https
  hosting; nothing of it runs on the device, and nothing passes through
  a server of the project's.

  The conversation, in messages between the two windows:
    this page says   { perinkpheral: "ready" }
    the device says  { perinkpheral: "app", name, title, settings, values }
                     the manifest's settings, including hidden ones;
                     values omit secret and link settings
    this page says   { perinkpheral: "settings", values: { key: "value" } }
                     keys the manifest declares, values as text, 255 bytes at most
  Only fields present in the form can be filled. Hidden settings are omitted
  from the form; an integration writes them through /api/apps/settings.
  The user saves the filled form. Message source and origin are checked by
  the device page; this example also pins an origin entered independently by the user.
-->
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Companion</title>
<h1 id="title">Companion</h1>
<form id="connect">
  <label>Device origin <input id="origin" type="url" placeholder="http://192.168.1.10" required></label>
  <button>Connect</button>
</form>
<form id="form">
  <label>Token <input id="token" autocomplete="off"></label>
  <button>Done</button>
</form>
<script>
/* Enter the device origin from its address bar. Never take it from an
 * incoming message, query parameter or referrer. It stays pinned until reload. */
let device = null;
let connected = false;
document.getElementById("connect").addEventListener("submit", event => {
  event.preventDefault();
  if (device || !window.opener) return;
  try {
    const url = new URL(document.getElementById("origin").value);
    if (!["http:", "https:"].includes(url.protocol) || url.username || url.password ||
        url.pathname !== "/" || url.search || url.hash) return;
    device = url.origin;
    window.opener.postMessage({ perinkpheral: "ready" }, device);
    document.getElementById("origin").disabled = true;
  } catch (_) { return; }
});

window.addEventListener("message", event => {
  if (!device || event.origin !== device || event.source !== window.opener || !event.data || event.data.perinkpheral !== "app") return;
  connected = true;
  document.getElementById("title").textContent = event.data.title;
});

document.getElementById("form").addEventListener("submit", event => {
  event.preventDefault();
  if (!connected) return;
  window.opener.postMessage({ perinkpheral: "settings",
                              values: { token: document.getElementById("token").value } }, device);
});


</script>
</html>
